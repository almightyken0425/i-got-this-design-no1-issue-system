<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Got This · F4 方向比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e8ed;color:#2c3441;font:14px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #4663d2;outline-offset:3px}.reviewbar{background:#fff;padding:18px 28px;display:flex;align-items:center;gap:34px;flex-wrap:wrap;border-bottom:1px solid #e5e8ed}.identity{display:flex;align-items:baseline;gap:12px}.identity strong{font-size:19px;letter-spacing:-.04em}.identity span{font-size:12px;color:#677384}.tabs{display:flex;gap:22px;align-items:center;margin-left:auto}.tabs button{min-height:44px;padding:8px 0;border:0;border-bottom:2px solid transparent;background:none;color:#677384}.tabs button.active{color:#4663d2;border-bottom-color:#4663d2;font-weight:650}.tools{padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#f8f9fb}.caption{flex:1;min-width:240px;color:#677384;font-size:12px;margin:0}.options{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.options label{display:flex;gap:8px;align-items:center;font-size:12px;color:#677384}.options select,.options button{border:1px solid #cdd3dd;border-radius:6px;padding:8px;background:#fff;min-height:38px}.stage{padding:22px;overflow:auto}.stage iframe{display:block;background:#fff;margin:0 auto;width:100%;height:940px;border:1px solid #cdd3dd;border-radius:12px;box-shadow:0 8px 30px #171d2909}.footnote{max-width:1150px;margin:12px auto 0;color:#677384;font-size:11px;line-height:1.8;text-align:center}.references{max-width:1320px;margin:0 auto;padding:30px}.references h1{font-size:22px;margin:0 0 8px}.references>.intro{color:#677384;font-size:12px;margin-bottom:30px}.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px 24px}.ref{margin:0;min-width:0}.refimage{padding:0;display:block;width:100%;border:1px solid #cdd3dd;border-radius:10px;overflow:hidden;background:#fff}.refimage img{display:block;width:100%;height:300px;object-fit:contain;background:#fff}.ref .kicker{display:flex;align-items:center;gap:12px;margin:14px 0 8px}.kicker small{font-size:10px;letter-spacing:.1em;color:#4663d2;font-weight:600}.kicker strong{font-size:14px}.ref p{font-size:12px;line-height:1.7;margin:0 0 8px;color:#4d596c}.ref a{font-size:11px;color:#677384}.references[hidden],.stage[hidden],.tools[hidden]{display:none}dialog{border:0;border-radius:12px;max-width:min(1200px,94vw);max-height:94vh;padding:16px;background:#fff;box-shadow:0 24px 80px #0e132030}dialog::backdrop{background:#171d29b0}dialog img{display:block;max-width:100%;max-height:74vh;object-fit:contain}dialog .modalbar{display:flex;align-items:center;gap:20px;justify-content:space-between;margin-bottom:12px}dialog button{background:#f0f2f6;border:0;border-radius:8px;min-width:44px;min-height:44px;font-size:22px}dialog p{font-size:12px;color:#4d596c}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);max-width:90vw;background:#2c3441;color:white;padding:12px 18px;border-radius:10px;z-index:20;font-size:12px;line-height:1.6}.toast[hidden]{display:none}@media(max-width:700px){.reviewbar{padding:12px 16px;gap:10px}.tabs{width:100%;gap:26px;margin-left:0}.tools{padding:12px 16px;gap:10px}.caption{width:100%}.options{gap:8px}.stage{padding:8px}.stage iframe{border-radius:8px}.footnote{text-align:left;padding:0 8px}.references{padding:20px 16px}.refgrid{grid-template-columns:1fr;gap:28px}.refimage img{height:auto;max-height:320px}}
</style></head>
<body>
<header class="reviewbar"><div class="identity"><strong>I Got This</strong><span>F4 方向比較</span></div><nav class="tabs" aria-label="比較方向"><button data-mode="a" class="active" aria-pressed="true">A 工作台</button><button data-mode="b" aria-pressed="false">B 圖像分區</button><button data-mode="refs" aria-pressed="false">參考圖 · 6</button></nav></header>
<div class="tools"><p class="caption" id="caption">固定側欄 · 緊湊直欄 · 分離屬性區</p><div class="options"><label>畫面<select id="screen"><option value="board">外殼與看板</option><option value="detail">工單詳情</option></select></label><label>寬度<select id="width"><option value="100%">桌面</option><option value="390px">手機 390</option><option value="320px">手機 320</option></select></label><button id="reset">重設資料</button></div></div>
<main class="stage" id="stage"><iframe id="preview" title="I Got This 互動比較" sandbox="allow-scripts allow-same-origin"></iframe><p class="footnote">共用本機資料快照：IGT-1 工單A、IGT-2 工單B。來源檢視名稱為「測試檢視」，內容未補造。編輯與拖曳只在本頁暫存，切換 A／B 保留同一份內容。</p></main>
<section class="references" id="references" hidden><h1>六張參考，各借一件事。</h1><p class="intro">外殼、看板、工單詳情各兩張。點圖可放大。</p><div class="refgrid" id="refgrid"></div></section>
<dialog id="lightbox"><div class="modalbar"><strong id="refTitle"></strong><button aria-label="關閉參考圖" id="closeLightbox">×</button></div><img id="refFull" alt=""><p id="refNote"></p></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const payload=__PAYLOAD__;
const frame=document.getElementById('preview'),screen=document.getElementById('screen');let mode='a',screenValue='board';
const decode=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,4000)}
function resize(){frame.style.width=document.getElementById('width').value;frame.style.maxWidth='100%';frame.style.height=document.getElementById('width').value==='100%'?'940px':'844px'}
function updateScreen(){const doc=frame.contentDocument;if(!doc)return;if(screen.value==='detail'){const card=doc.querySelector('article');if(card)card.click()}else{const back=[...doc.querySelectorAll('button')].find(b=>b.textContent.includes('返回'));if(back)back.click()}screenValue=screen.value}
function render(){frame.srcdoc=decode(payload.app);resize();frame.onload=()=>{const doc=frame.contentDocument;doc.body.dataset.direction=mode;const obs=new MutationObserver(()=>{if(screen.value==='detail'&&doc.querySelector('article')){obs.disconnect();updateScreen()}});if(screen.value==='detail')obs.observe(doc.body,{childList:true,subtree:true});doc.addEventListener('click',event=>{const a=event.target.closest('a');if(a&&a.getAttribute('href')!=='/kanban'){event.preventDefault();event.stopImmediatePropagation();showToast('這輪比較外殼、看板與詳情，其他畫面保留現有版本。')}},true);doc.addEventListener('click',()=>setTimeout(()=>{const detail=!!doc.querySelector('.issue-detail');screen.value=detail?'detail':'board';screenValue=screen.value},40));}}
function setMode(next){document.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===next;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('references').hidden=next!=='refs';document.getElementById('stage').hidden=next==='refs';document.querySelector('.tools').hidden=next==='refs';if(next==='refs')return;mode=next;document.getElementById('caption').textContent=next==='a'?'固定側欄 · 緊湊直欄 · 分離屬性區':'頂部導航 · 橫向階段 · 集中閱讀';if(frame.contentDocument?.body)frame.contentDocument.body.dataset.direction=next;}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));screen.onchange=updateScreen;document.getElementById('width').onchange=resize;document.getElementById('reset').onclick=()=>{render();showToast('已回到原始兩筆工單。')};
const lightbox=document.getElementById('lightbox');document.getElementById('closeLightbox').onclick=()=>lightbox.close();lightbox.onclick=e=>{if(e.target===lightbox)lightbox.close()};
for(const ref of payload.references){const figure=document.createElement('figure');figure.className='ref';const button=document.createElement('button');button.className='refimage';button.setAttribute('aria-label','放大 '+ref.title);const img=document.createElement('img');img.src=ref.data;img.alt=ref.title;button.append(img);button.onclick=()=>{document.getElementById('refTitle').textContent=ref.title;document.getElementById('refFull').src=ref.data;document.getElementById('refFull').alt=ref.title;document.getElementById('refNote').textContent=ref.note;lightbox.showModal()};const caption=document.createElement('figcaption');const heading=document.createElement('div');heading.className='kicker';const small=document.createElement('small');small.textContent=ref.area;const title=document.createElement('strong');title.textContent=ref.title;heading.append(small,title);const note=document.createElement('p');note.textContent=ref.note;const source=document.createElement('a');source.href=ref.source;source.target='_blank';source.rel='noopener noreferrer';source.textContent='官方來源 ↗';caption.append(heading,note,source);figure.append(button,caption);document.getElementById('refgrid').append(figure)}
render();
</script></body></html>
